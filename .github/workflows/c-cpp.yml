name: Build OPK

on:
  workflow_dispatch:
  push:
    branches: [opendingux]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 升级所有 Actions 到最新版本
    - name: Checkout code
      uses: actions/checkout@v4  # 升级到 v4

    # 2. 修复 Docker 设置
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3  # 升级到 v3

    # 3. 修复构建步骤 - 添加构建上下文
    - name: Build the Docker image
      env:
        DOCKER_BUILDKIT: 1
      run: |
        docker build --progress=plain -t my-opk-image .
        
    # 4. 修复文件提取 - 使用 volume 挂载
    - name: Extract OPK from container
      run: |
        # 创建临时目录
        mkdir -p opk-output
        
        # 运行容器并挂载目录
        docker run --rm -v $(pwd)/opk-output:/output my-opk-image
        
        # 检查文件是否存在
        if [ ! -f "opk-output/*.opk" ]; then
          echo "Error: No OPK file found in container output!"
          ls -la opk-output
          exit 1
        fi
        
        # 重命名文件
        mv opk-output/*.opk ./my-opk-package.opk

    # 5. 修复上传步骤 - 升级到 v4
    - name: Upload OPK artifact
      uses: actions/upload-artifact@v4  # 升级到 v4
      with:
        name: my-opk-package
        path: my-opk-package.opk
        retention-days: 7
