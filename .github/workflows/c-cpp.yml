name: Build FCEUX for Dingux Devices

on:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        device: [gcw0, retrofw, lepus]
        include:
          - device: gcw0
            odversion: "2014"
          - device: retrofw
            odversion: ""
          - device: lepus
            odversion: ""
    
    name: Build for ${{ matrix.device }}
    env:
      DEVICE: ${{ matrix.device }}
      ODVERSION: ${{ matrix.odversion }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        sudo apt-get install -y libsdl1.2-dev
        sudo apt-get install -y squashfs-tools
        sudo apt-get install -y wget tar xz-utils
        sudo apt-get install -y git make pkg-config
    
    - name: Setup GCW0 Toolchain
      run: |
        TOOLCHAIN_URL="https://github.com/retrofw/gcw0-toolchain/releases/download/2021-08-01/gcw0-toolchain-2021-08-01.tar.xz"
        wget $TOOLCHAIN_URL -O gcw0-toolchain.tar.xz
        sudo mkdir -p /opt
        sudo tar -xJf gcw0-toolchain.tar.xz -C /opt
        rm gcw0-toolchain.tar.xz
        echo "/opt/gcw0-toolchain/usr/bin" >> $GITHUB_PATH
    
    - name: Build Release
      run: |
        make DEVICE=$DEVICE ODVERSION=$ODVERSION -j$(nproc)
    
    - name: Build Debug (GCW0 only)
      if: matrix.device == 'gcw0'
      run: |
        make clean
        make DEVICE=$DEVICE ODVERSION=$ODVERSION DEBUG=yes -j$(nproc)
    
    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/$DEVICE
        cp bin/* artifacts/$DEVICE/
        cd artifacts/$DEVICE
        for f in *; do
          # 只处理文件，忽略目录
          if [ -f "$f" ]; then
            filename="${f%.*}"
            extension="${f##*.}"
            mv "$f" "${filename}-${DEVICE}.${extension}"
          fi
        done
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fceux1-${{ matrix.device }}-binaries
        path: artifacts/$DEVICE/*
