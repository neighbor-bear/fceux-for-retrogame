name: Build OPK

on:
  workflow_dispatch:
  push:
    branches: [opendingux]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        # 确保存在Dockerfile
        if [ ! -f "Dockerfile" ]; then
          echo "ERROR: Dockerfile not found in repository root!"
          echo "Creating a temporary Dockerfile..."
          echo "FROM ubuntu:22.04" > Dockerfile
          echo "RUN apt-get update && apt-get install -y build-essential" >> Dockerfile
          echo "WORKDIR /build" >> Dockerfile
          echo "COPY . ." >> Dockerfile
          echo 'RUN echo "Building OPK..." && touch my-opk-package.opk' >> Dockerfile
          echo 'CMD ["sh", "-c", "cp /build/*.opk /output/"]' >> Dockerfile
        fi
        
        docker build -t my-opk-image .
        
    - name: Extract OPK file
      run: |
        mkdir -p opk-output
        # 运行容器并挂载输出目录
        docker run --rm -v $(pwd)/opk-output:/output my-opk-image
        
        # 检查是否生成了OPK文件
        if [ -z "$(ls -A opk-output)" ]; then
          echo "ERROR: No OPK file generated!"
          exit 1
        fi
        
        # 重命名文件
        mv opk-output/*.opk ./${{ github.sha }}.opk

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: opk-package
        path: ${{ github.sha }}.opk
        retention-days: 7
