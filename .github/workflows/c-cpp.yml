name: Build OPK

on:
  workflow_dispatch:
  push:
    branches: [opendingux]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        if [ ! -f "Dockerfile" ]; then
          echo "::error::Dockerfile not found!"
          exit 1
        fi
        
        docker build -t my-opk-image . \
          --progress=plain \
          --no-cache \
          --build-arg BUILDKIT_INLINE_CACHE=1
        
        if ! docker image inspect my-opk-image &>/dev/null; then
          echo "::error::Docker image build failed!"
          exit 1
        fi

    - name: Extract OPK file
      run: |
        mkdir -p opk-output
        docker run --rm -v $(pwd)/opk-output:/final-output my-opk-image
        
        if [ ! -s "opk-output/fceux.opk" ]; then
          echo "::error::OPK file is empty or missing!"
          CONTAINER_ID=$(docker create my-opk-image)
          docker cp $CONTAINER_ID:/build/fceux.opk opk-output/fceux.opk || true
          docker rm -v $CONTAINER_ID
          
          if [ ! -s "opk-output/fceux.opk" ]; then
            echo "::error::Failed to get OPK file from container"
            docker run --rm my-opk-image find / -name "*.opk" -ls
            exit 1
          fi
        fi
        
        mv opk-output/fceux.opk ./${{ github.sha }}.opk
        echo "OPK file created: $(ls -lh ${{ github.sha }}.opk)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: opk-package
        path: ${{ github.sha }}.opk
        retention-days: 7
